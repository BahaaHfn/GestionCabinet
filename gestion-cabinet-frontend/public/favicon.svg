<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" fill="#0ea5e9" />
  
  <!-- Stethoscope icon in white -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Headset tubes -->
    <path d="M 35 25 L 35 35 A 15 15 0 0 0 65 35 L 65 25" />
    
    <!-- Ear tips -->
    <circle cx="35" cy="22" r="3.5" fill="#ffffff" stroke="none" />
    <circle cx="65" cy="22" r="3.5" fill="#ffffff" stroke="none" />
    
    <!-- Connecting tube -->
    <path d="M 50 50 L 50 65 A 12 12 0 0 0 74 65" />
    
    <!-- Chestpiece connector -->
    <path d="M 74 65 L 74 72" />
    
    <!-- Chestpiece bell -->
    <circle cx="74" cy="75" r="7" fill="#ffffff" stroke="none" />
  </g>
</svg>
