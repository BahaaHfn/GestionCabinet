<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head('Détail Médecin — GestionCabinet')}">
    <title></title>
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: sidebar(${currentPage})}"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content" style="margin-top:56px;">
        <div class="page-header d-flex flex-wrap align-items-center justify-content-between gap-3">
            <h2><i class="fa-solid fa-user-doctor me-2"></i>Fiche Médecin</h2>
            <div class="d-flex gap-2">
                <a th:href="@{/doctors/edit/{id}(id=${doctor.id})}" class="btn btn-warning">
                    <i class="fa-solid fa-pen me-1"></i> Modifier
                </a>
                <a th:href="@{/doctors}" class="btn btn-outline-secondary">
                    <i class="fa-solid fa-arrow-left me-1"></i> Retour
                </a>
            </div>
        </div>
        <div class="detail-card mb-4">
            <div class="row">
                <div class="col-md-6 col-lg-4">
                    <div class="detail-label">Nom</div>
                    <div class="detail-value" th:text="${doctor.nom}"></div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="detail-label">Prénom</div>
                    <div class="detail-value" th:text="${doctor.prenom}"></div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="detail-label">Spécialité</div>
                    <div class="detail-value" th:text="${doctor.specialite}"></div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="detail-label">Email</div>
                    <div class="detail-value" th:text="${doctor.email}"></div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="detail-label">Téléphone</div>
                    <div class="detail-value" th:text="${doctor.telephone} ?: '—'"></div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="detail-label">Rôle</div>
                    <div class="detail-value">
                        <span class="badge" th:classappend="${doctor.role == 'ADMIN'} ? 'bg-danger' : 'bg-primary'" th:text="${doctor.role}"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="table-container">
            <h5 class="mb-3"><i class="fa-solid fa-stethoscope me-2"></i>Consultations du médecin</h5>
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Patient</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${doctor.consultations}">
                            <td th:text="${c.date != null} ? ${#temporals.format(c.date, 'dd/MM/yyyy HH:mm')} : '—'"></td>
                            <td>
                                <span th:if="${c.patient != null}" th:text="${c.patient.nom + ' ' + c.patient.prenom}"></span>
                                <span th:if="${c.patient == null}" class="text-muted">—</span>
                            </td>
                            <td th:text="${c.description}"></td>
                        </tr>
                        <tr th:if="${doctor.consultations == null or #lists.isEmpty(doctor.consultations)}">
                            <td colspan="3" class="text-center text-muted py-4">Aucune consultation pour ce médecin</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
