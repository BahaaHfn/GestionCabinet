<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — GestionCabinet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
        }
        .login-card .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-card .logo i {
            font-size: 3rem;
            color: #1a73e8;
        }
        .login-card .logo h2 {
            font-weight: 700;
            color: #212529;
            margin-top: 12px;
        }
        .login-card .logo p {
            color: #6c757d;
            font-size: 0.9rem;
        }
        .form-control:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 0.2rem rgba(26,115,232,0.15);
        }
        .btn-login {
            background-color: #1a73e8;
            border-color: #1a73e8;
            font-weight: 600;
            padding: 12px;
            font-size: 1rem;
        }
        .btn-login:hover {
            background-color: #1557b0;
            border-color: #1557b0;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <i class="fa-solid fa-hospital"></i>
            <h2>GestionCabinet</h2>
            <p>Connectez-vous pour accéder à votre espace</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center" role="alert">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            Email ou mot de passe incorrect.
        </div>
        <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center" role="alert">
            <i class="fa-solid fa-check-circle me-2"></i>
            Vous avez été déconnecté avec succès.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" class="form-control" id="username" name="username" placeholder="docteur@cabinet.com" required autofocus />
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Mot de passe</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required />
                </div>
            </div>
            <button type="submit" class="btn btn-login btn-primary w-100">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Se connecter
            </button>
        </form>
    </div>
</body>
</html>
