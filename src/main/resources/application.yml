spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gestioncabinet?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

cors:
  allowed-origins: "http://localhost:3000,http://localhost:8080,http://localhost:5173"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  allow-credentials: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

server:
  port: 8080

jwt:
  secret: 9a72635df8924e2354e3d368e5967232230678d4957e87df34a2e5898d975a61d62c938b81db621a60cf2b291d29388df0a1f0a2df3b482c3848b812ef0d27c6
  expiration: 86400000
